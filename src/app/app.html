<app-head-bar></app-head-bar>
<app-search-bar [autos]="autoList" (selectAutoEvent)="updateAuto($event)"></app-search-bar>

<div *ngIf="selectedAuto" class="overlay" (click)="closeDetails()">
  <div class="modal" (click)="$event.stopPropagation()">
    <button class="close" (click)="closeDetails()">✕</button>

    <div class="visual">
      <img [src]="'images/' + selectedAuto.photo" [alt]="selectedAuto.model" />
    </div>

    <div class="infos">
      <span class="brand">{{ selectedAuto.brand }}</span>
      <h2>{{ selectedAuto.model }}</h2>

      <p class="description">{{ selectedAuto.description }}</p>

      <div class="specs">
        <div><small>Make</small><p>{{ selectedAuto.brand }}</p></div>
        <div><small>Model</small><p>{{ selectedAuto.model }}</p></div>
        <div><small>Power</small><p>{{ selectedAuto.power }} CV</p></div>
        <div><small>Availability</small><p>{{ selectedAuto.availability }} units</p></div>
      </div>

      <div class="price">
        <small>Price</small>
        <strong>{{ selectedAuto.price }} DNT</strong>
      </div>
    </div>
  </div>
</div>
